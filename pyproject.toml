[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple_agent"
version = "0.1.0"
description = "Expert data generation and RL/BC training for UR5 apple picking on top of pybullet_tree_sim."
requires-python = ">=3.9"
authors = [{ name = "Robin Eshraghi" }]
dependencies = [
    # Simulator, pinned to a commit of the fork (replace with a release tag once one exists).
    # For simulator development install a local clone instead: pip install -e ../UR5-ApplePathPlanning-Sim-PyBullet
    "pybullet_tree_sim @ git+https://github.com/MAmirEshraghi/UR5-ApplePathPlanning-Sim-PyBullet@fd5acbc7e89778d97eb0073f80202ccae828165e",
    "numpy==1.26.4",
    "filelock",
    "gymnasium",
    "h5py",
    "opencv-python",
    "pybullet==3.2.6",
    "pybullet-planning",
    "scipy",
    "zenlog",
    # learning
    "imageio",
    "matplotlib",
    "pillow",
    "psutil",
    "sb3-contrib",
    "seaborn",
    "stable-baselines3",
    "torch",
    "torchvision",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["apple_agent"]
